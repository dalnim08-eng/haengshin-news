<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>haengshin news</title>
  <meta name="description" content="haengshin news - 동아리와 그룹을 위한 소식 플랫폼" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --ink:#111827; --muted:#6b7280; --soft:#f3f4f6; --line:#e5e7eb; --paper:#fff;
      --accent:#0f172a; --accent2:#2563eb; --danger:#dc2626; --ok:#059669;
      --shadow:0 18px 40px rgba(15,23,42,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;background:#f7f7f5;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.58}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    .topbar{background:#0b1220;color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
    .topbar-inner{max-width:1180px;margin:0 auto;padding:9px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;font-size:13px;color:#d1d5db}
    .mini-links{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
    .mini-links button{background:transparent;border:0;color:#d1d5db;padding:0}.mini-links button:hover{color:#fff}
    header{background:#fff;border-bottom:1px solid var(--line)}
    .masthead{max-width:1180px;margin:0 auto;padding:28px 18px 21px;display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:end}
    .date{font-size:13px;color:var(--muted)}
    .brand{text-align:center}.brand h1{margin:0;letter-spacing:-.06em;font-family:Georgia,"Times New Roman",serif;font-size:52px;line-height:1;color:#111}.brand p{margin:8px 0 0;font-size:13px;color:#64748b;letter-spacing:.08em;text-transform:uppercase}
    .head-actions{display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:#111827;padding:9px 12px;border-radius:999px;font-size:14px;transition:.18s}.btn:hover{border-color:#94a3b8;box-shadow:0 7px 18px rgba(15,23,42,.08)}.btn.dark{background:#111827;color:#fff;border-color:#111827}.btn.blue{background:#2563eb;color:#fff;border-color:#2563eb}.btn.red{background:#fff;color:var(--danger);border-color:#fecaca}.btn.ghost{background:transparent}
    nav{border-top:1px solid var(--line);background:#fff}.nav-inner{max-width:1180px;margin:0 auto;padding:0 18px;display:flex;gap:2px;align-items:center;overflow:auto}.nav-btn{border:0;background:transparent;padding:14px 14px;color:#374151;white-space:nowrap;border-bottom:3px solid transparent}.nav-btn:hover,.nav-btn.active{color:#111827;border-bottom-color:#111827;background:#f9fafb}
    .ticker{background:#fff;border-bottom:1px solid var(--line)}.ticker-inner{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;gap:12px;align-items:center}.ticker-label{font-size:12px;font-weight:800;color:#fff;background:#111827;border-radius:4px;padding:3px 7px}.ticker-text{font-size:14px;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    main{max-width:1180px;margin:0 auto;padding:24px 18px 48px}.layout{display:grid;grid-template-columns:1.7fr .9fr;gap:24px}.maincol,.sidecol{min-width:0}
    .search-row{display:flex;gap:8px;margin-bottom:18px}.search-row input{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:12px 15px}.search-row input:focus{outline:2px solid rgba(37,99,235,.16);border-color:#93c5fd}
    .hero{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);display:grid;grid-template-columns:1.1fr .9fr;margin-bottom:22px}.hero-img{min-height:320px;background:linear-gradient(135deg,#e5e7eb,#f8fafc);position:relative;overflow:hidden}.hero-img img{width:100%;height:100%;object-fit:cover;display:block}.hero-body{padding:28px}.kicker{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#1d4ed8;letter-spacing:.06em;text-transform:uppercase}.hero h2{margin:13px 0 10px;font-family:Georgia,"Times New Roman",serif;font-size:38px;line-height:1.12;letter-spacing:-.03em}.summary{color:#4b5563}.meta{margin-top:16px;color:#6b7280;font-size:13px;display:flex;gap:10px;flex-wrap:wrap}.article-card{background:#fff;border:1px solid var(--line);display:grid;grid-template-columns:190px 1fr;gap:16px;padding:14px;margin-bottom:12px;transition:.16s}.article-card:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(15,23,42,.07)}.thumb{background:#f1f5f9;min-height:125px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.article-card h3{margin:4px 0 7px;font-size:20px;line-height:1.25}.article-card p{margin:0;color:#4b5563;font-size:14px}.empty{background:#fff;border:1px dashed #cbd5e1;padding:44px 24px;text-align:center;color:#64748b}.empty strong{display:block;color:#111827;font-size:20px;margin-bottom:6px}
    .panel{background:#fff;border:1px solid var(--line);padding:18px;margin-bottom:18px}.panel h3{margin:0 0 12px;font-size:16px;border-bottom:2px solid #111827;padding-bottom:8px}.list-compact{display:grid;gap:12px}.compact-item{border-bottom:1px solid var(--line);padding-bottom:12px}.compact-item:last-child{border-bottom:0;padding-bottom:0}.compact-item button{padding:0;border:0;background:transparent;text-align:left;color:#111827;font-weight:700}.compact-item span{display:block;color:#6b7280;font-size:12px;margin-top:3px}.tag-cloud{display:flex;gap:8px;flex-wrap:wrap}.tag{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:7px 10px;font-size:13px;color:#334155}.status{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:12px 14px;border-radius:12px;box-shadow:var(--shadow);z-index:50;display:none;max-width:360px}.status.show{display:block}.status.ok{background:#065f46}.status.err{background:#991b1b}
    dialog{border:0;border-radius:18px;padding:0;max-width:920px;width:calc(100% - 30px);box-shadow:0 30px 80px rgba(15,23,42,.35)}dialog::backdrop{background:rgba(15,23,42,.55)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.modal-head h2{margin:0;font-size:20px}.modal-body{padding:20px;max-height:78vh;overflow:auto}.close{border:0;background:#f3f4f6;border-radius:999px;width:36px;height:36px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:13px;font-weight:700;color:#374151}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}.field textarea{min-height:150px;resize:vertical}.full{grid-column:1/-1}.editor-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}.preview{border:1px solid var(--line);border-radius:14px;background:#f8fafc;min-height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#64748b}.preview img{width:100%;height:240px;object-fit:cover;display:block}.admin-list{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.admin-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}.admin-row strong{display:block}.admin-row span{font-size:12px;color:#64748b}.admin-row .ops{display:flex;gap:6px;flex-wrap:wrap}
    .article-view{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);padding:28px}.article-view .main-image{margin:18px 0}.article-view .main-image img{width:100%;max-height:520px;object-fit:cover}.caption{font-size:12px;color:#64748b;margin-top:6px}.article-view h2{font-family:Georgia,"Times New Roman",serif;font-size:44px;line-height:1.12;letter-spacing:-.04em;margin:12px 0}.article-body{white-space:pre-wrap;font-size:17px}.backline{margin-bottom:16px}.login-note{font-size:13px;color:#64748b;margin-top:10px}.footer{border-top:1px solid var(--line);background:#fff;color:#6b7280}.footer-inner{max-width:1180px;margin:0 auto;padding:24px 18px;font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.hidden{display:none!important}
    @media(max-width:860px){.masthead{grid-template-columns:1fr;text-align:center}.head-actions{justify-content:center}.brand h1{font-size:40px}.layout{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.article-card{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.article-view h2{font-size:32px}}
  </style>
</head>
<body>
  <div class="topbar"><div class="topbar-inner"><div id="today"></div><div class="mini-links"><button id="loginTopBtn">편집자 로그인</button><button id="logoutTopBtn" class="hidden">로그아웃</button></div></div></div>
  <header><div class="masthead"><div class="date">동아리 소식 · 활동 기록 · 공지</div><div class="brand"><h1>haengshin news</h1><p>club newsroom</p></div><div class="head-actions"><button class="btn dark hidden" id="manageBtn">기사 관리</button></div></div></header>
  <nav><div class="nav-inner" id="nav"></div></nav>
  <section class="ticker"><div class="ticker-inner"><span class="ticker-label">NOTICE</span><span class="ticker-text" id="tickerText">새로운 소식이 등록되면 이곳에 최신 기사가 표시됩니다.</span></div></section>
  <main><div class="search-row"><input id="searchInput" placeholder="기사 검색" autocomplete="off" /><button class="btn" id="searchClear">초기화</button></div><div id="content"></div></main>
  <footer class="footer"><div class="footer-inner"><span>© haengshin news</span><span>동아리와 그룹 구성원을 위한 소식 플랫폼</span></div></footer>

  <dialog id="loginDialog"><div class="modal-head"><h2>편집자 로그인</h2><button class="close" data-close="loginDialog">×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>이메일</label><input id="loginEmail" type="email" placeholder="editor@example.com"></div><div class="field"><label>비밀번호</label><input id="loginPassword" type="password" placeholder="비밀번호"></div></div><div class="editor-actions"><button class="btn" id="signupBtn">계정 만들기</button><button class="btn blue" id="signinBtn">로그인</button></div><p class="login-note">편집자 계정으로 로그인한 경우에만 기사 관리 메뉴가 표시됩니다.</p></div></dialog>

  <dialog id="editorDialog"><div class="modal-head"><h2>기사 관리</h2><button class="close" data-close="editorDialog">×</button></div><div class="modal-body"><input type="hidden" id="articleId"><input type="hidden" id="currentImagePath"><input type="hidden" id="currentImageUrl"><div class="form-grid"><div class="field full"><label>제목</label><input id="title" placeholder="기사 제목"></div><div class="field"><label>분야</label><select id="category"><option>공지</option><option>활동</option><option>인터뷰</option><option>사진</option><option>칼럼</option><option>아카이브</option><option>종합</option></select></div><div class="field"><label>작성자</label><input id="author" placeholder="편집부"></div><div class="field full"><label>요약</label><textarea id="summary" placeholder="목록에 표시될 짧은 요약"></textarea></div><div class="field full"><label>본문</label><textarea id="body" placeholder="기사 본문"></textarea></div><div class="field"><label>대표 사진</label><input id="imageFile" type="file" accept="image/*"><small style="color:#64748b">선택하지 않으면 기존 사진이 유지됩니다.</small></div><div class="field"><label>사진 미리보기</label><div class="preview" id="imagePreview">대표 사진 없음</div></div><div class="field full"><label>사진 설명</label><input id="caption" placeholder="사진 설명 또는 출처"></div><div class="field"><label>상단 고정</label><select id="pinned"><option value="false">아니오</option><option value="true">예</option></select></div></div><div class="editor-actions"><button class="btn" id="newArticleBtn">새 글</button><button class="btn blue" id="saveArticleBtn">저장</button></div><div class="admin-list"><h3>등록된 기사</h3><div id="adminList"></div></div></div></dialog>

  <div class="status" id="status"></div>
  <script>
    const CONFIG = {
      supabaseUrl: 'https://vcveyhhbnoikziicpljk.supabase.co',
      supabaseAnonKey: 'sb_publishable_fgqKwRloiNvNb83PhCNZow_PM59mBYA',
      bucket: 'article-images'
    };
    const CATEGORIES = ['종합','공지','활동','인터뷰','사진','칼럼','아카이브'];
    const $ = (id)=>document.getElementById(id);
    const client = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
    let state = { articles: [], category: '종합', query: '', session: null };
    const fmtDate = (v)=> new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v));
    const escapeHtml = (s='') => String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function showStatus(msg, type=''){ const el=$('status'); el.textContent=msg; el.className='status show '+type; setTimeout(()=>el.className='status',3200); }
    function openDialog(id){ $(id).showModal(); }
    function closeDialog(id){ $(id).close(); }
    function buildNav(){ $('nav').innerHTML=''; const wrap=document.createElement('div'); wrap.className='nav-inner'; CATEGORIES.forEach(c=>{ const b=document.createElement('button'); b.className='nav-btn'+(state.category===c?' active':''); b.textContent=c; b.onclick=()=>{state.category=c; render();}; wrap.appendChild(b); }); $('nav').appendChild(wrap); }
    function filteredArticles(){ const q=state.query.trim().toLowerCase(); return state.articles.filter(a=>{ const okCat = state.category==='종합' || a.category===state.category; const text=[a.title,a.summary,a.body,a.author,a.category].join(' ').toLowerCase(); return okCat && (!q || text.includes(q)); }); }
    async function loadSession(){ const { data } = await client.auth.getSession(); state.session = data.session; updateAuthUI(); client.auth.onAuthStateChange((_event, session)=>{ state.session=session; updateAuthUI(); }); }
    function updateAuthUI(){ const on=!!state.session; $('manageBtn').classList.toggle('hidden',!on); $('logoutTopBtn').classList.toggle('hidden',!on); $('loginTopBtn').classList.toggle('hidden',on); }
    async function loadArticles(){ const { data, error } = await client.from('articles').select('*').order('pinned',{ascending:false}).order('created_at',{ascending:false}); if(error){ console.error(error); showStatus('기사 목록을 불러오지 못했습니다. RLS 정책과 테이블 이름을 확인하세요.','err'); return; } state.articles=data||[]; render(); }
    function render(){ buildNav(); const items=filteredArticles(); const content=$('content'); if(state.articles.length){ $('tickerText').textContent = state.articles[0].title; } if(!items.length){ content.innerHTML = `<div class="empty"><strong>등록된 기사가 없습니다</strong><span>편집자가 새 기사를 저장하면 이곳에 표시됩니다.</span></div>`; renderAdminList(); return; }
      const [lead,...rest]=items; content.innerHTML = `<div class="layout"><section class="maincol"><article class="hero" role="button" tabindex="0" data-open="${lead.id}"><div class="hero-img">${lead.image_url?`<img src="${escapeHtml(lead.image_url)}" alt="">`:''}</div><div class="hero-body"><span class="kicker">${escapeHtml(lead.category)}</span><h2>${escapeHtml(lead.title)}</h2><p class="summary">${escapeHtml(lead.summary||'')}</p><div class="meta"><span>${escapeHtml(lead.author||'편집부')}</span><span>${fmtDate(lead.created_at)}</span><span>조회 ${lead.views||0}</span></div></div></article><div id="articleList"></div></section><aside class="sidecol"><div class="panel"><h3>최신 소식</h3><div class="list-compact">${state.articles.slice(0,5).map(a=>`<div class="compact-item"><button data-open="${a.id}">${escapeHtml(a.title)}</button><span>${escapeHtml(a.category)} · ${fmtDate(a.created_at)}</span></div>`).join('')}</div></div><div class="panel"><h3>분야</h3><div class="tag-cloud">${CATEGORIES.map(c=>`<button class="tag" data-cat="${c}">${c}</button>`).join('')}</div></div></aside></div>`;
      const list=$('articleList'); list.innerHTML=rest.map(a=>`<article class="article-card" role="button" tabindex="0" data-open="${a.id}"><div class="thumb">${a.image_url?`<img src="${escapeHtml(a.image_url)}" alt="">`:''}</div><div><span class="kicker">${escapeHtml(a.category)}</span><h3>${escapeHtml(a.title)}</h3><p>${escapeHtml(a.summary||'')}</p><div class="meta"><span>${escapeHtml(a.author||'편집부')}</span><span>${fmtDate(a.created_at)}</span><span>조회 ${a.views||0}</span></div></div></article>`).join('');
      document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openArticle(el.dataset.open)); document.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{state.category=el.dataset.cat;render();}); renderAdminList(); }
    async function openArticle(id){ const a=state.articles.find(x=>x.id===id); if(!a) return; client.from('articles').update({views:(a.views||0)+1, updated_at:new Date().toISOString()}).eq('id',id).then(()=>loadArticles()); $('content').innerHTML=`<div class="article-view"><div class="backline"><button class="btn" id="backBtn">← 목록으로</button></div><span class="kicker">${escapeHtml(a.category)}</span><h2>${escapeHtml(a.title)}</h2><div class="meta"><span>${escapeHtml(a.author||'편집부')}</span><span>${fmtDate(a.created_at)}</span><span>조회 ${(a.views||0)+1}</span></div>${a.image_url?`<div class="main-image"><img src="${escapeHtml(a.image_url)}" alt=""><div class="caption">${escapeHtml(a.caption||'')}</div></div>`:''}<p class="summary">${escapeHtml(a.summary||'')}</p><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><div class="article-body">${escapeHtml(a.body||'')}</div></div>`; $('backBtn').onclick=()=>render(); }
    async function uploadImage(file){ if(!file) return null; const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''); const path=`articles/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`; const { error } = await client.storage.from(CONFIG.bucket).upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type}); if(error) throw error; const { data } = client.storage.from(CONFIG.bucket).getPublicUrl(path); return { path, url:data.publicUrl }; }
    async function saveArticle(){ if(!state.session){ openDialog('loginDialog'); return; } const title=$('title').value.trim(), body=$('body').value.trim(); if(!title||!body){ showStatus('제목과 본문은 필수입니다.','err'); return; } try{ $('saveArticleBtn').disabled=true; let imageUrl=$('currentImageUrl').value||null, imagePath=$('currentImagePath').value||null; const file=$('imageFile').files[0]; if(file){ const uploaded=await uploadImage(file); imageUrl=uploaded.url; imagePath=uploaded.path; } const payload={ title, category:$('category').value, author:$('author').value.trim()||'편집부', summary:$('summary').value.trim(), body, image_url:imageUrl, image_path:imagePath, caption:$('caption').value.trim(), pinned:$('pinned').value==='true', updated_at:new Date().toISOString()}; const id=$('articleId').value; let res; if(id) res=await client.from('articles').update(payload).eq('id',id); else res=await client.from('articles').insert(payload); if(res.error) throw res.error; showStatus('저장되었습니다.','ok'); resetForm(); await loadArticles(); } catch(e){ console.error(e); showStatus('저장 실패: '+(e.message||e),'err'); } finally{ $('saveArticleBtn').disabled=false; } }
    async function deleteArticle(id){ if(!confirm('이 기사를 삭제하시겠습니까?')) return; const { error } = await client.from('articles').delete().eq('id',id); if(error){ showStatus('삭제 실패: '+error.message,'err'); return; } showStatus('삭제되었습니다.','ok'); await loadArticles(); }
    function editArticle(id){ const a=state.articles.find(x=>x.id===id); if(!a) return; $('articleId').value=a.id; $('currentImagePath').value=a.image_path||''; $('currentImageUrl').value=a.image_url||''; $('title').value=a.title||''; $('category').value=a.category||'종합'; $('author').value=a.author||'편집부'; $('summary').value=a.summary||''; $('body').value=a.body||''; $('caption').value=a.caption||''; $('pinned').value=String(!!a.pinned); $('imageFile').value=''; $('imagePreview').innerHTML=a.image_url?`<img src="${escapeHtml(a.image_url)}" alt="">`:'대표 사진 없음'; }
    function resetForm(){ ['articleId','currentImagePath','currentImageUrl','title','summary','body','caption'].forEach(id=>$(id).value=''); $('author').value='편집부'; $('category').value='공지'; $('pinned').value='false'; $('imageFile').value=''; $('imagePreview').textContent='대표 사진 없음'; }
    function renderAdminList(){ const box=$('adminList'); if(!box) return; if(!state.articles.length){ box.innerHTML='<p style="color:#64748b">아직 등록된 기사가 없습니다.</p>'; return; } box.innerHTML=state.articles.map(a=>`<div class="admin-row"><div><strong>${escapeHtml(a.title)}</strong><span>${escapeHtml(a.category)} · ${fmtDate(a.created_at)}</span></div><div class="ops"><button class="btn" data-edit="${a.id}">수정</button><button class="btn red" data-del="${a.id}">삭제</button></div></div>`).join(''); box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editArticle(b.dataset.edit)); box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteArticle(b.dataset.del)); }
    function bind(){ $('today').textContent=new Intl.DateTimeFormat('ko-KR',{dateStyle:'full'}).format(new Date()); $('loginTopBtn').onclick=()=>openDialog('loginDialog'); $('manageBtn').onclick=()=>{renderAdminList();openDialog('editorDialog');}; $('logoutTopBtn').onclick=async()=>{await client.auth.signOut();showStatus('로그아웃되었습니다.','ok');}; document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeDialog(b.dataset.close)); $('signinBtn').onclick=async()=>{ const {error}=await client.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value}); if(error) showStatus('로그인 실패: '+error.message,'err'); else {closeDialog('loginDialog'); showStatus('로그인되었습니다.','ok');} }; $('signupBtn').onclick=async()=>{ const {error}=await client.auth.signUp({email:$('loginEmail').value.trim(),password:$('loginPassword').value}); if(error) showStatus('가입 실패: '+error.message,'err'); else showStatus('계정 생성 요청이 완료되었습니다. 이메일 확인 설정을 확인하세요.','ok'); }; $('saveArticleBtn').onclick=saveArticle; $('newArticleBtn').onclick=resetForm; $('searchInput').oninput=(e)=>{state.query=e.target.value;render();}; $('searchClear').onclick=()=>{state.query='';$('searchInput').value='';state.category='종합';render();}; $('imageFile').onchange=(e)=>{ const file=e.target.files[0]; if(!file){$('imagePreview').textContent='대표 사진 없음';return;} const url=URL.createObjectURL(file); $('imagePreview').innerHTML=`<img src="${url}" alt="">`; }; }
    (async function init(){ bind(); buildNav(); await loadSession(); await loadArticles(); })();
  </script>
</body>
</html>
